<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎃 Concurso de Fantasias</title>
<style>
  :root { --bg:#0d0a14; --card:#1b1426; --orange:#ff7a18; --purple:#9b5de5; --text:#f3eefc; --muted:#a99bbf; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin:0; font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #2a1640, var(--bg) 60%); background-attachment: fixed; color: var(--text); min-height: 100vh; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 60px; }
  .capa { position: relative; border-radius: 20px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 10px 40px #ff7a1833; }
  .capa img { display:block; width:100%; height: 420px; object-fit: cover; object-position: center 15%; }
  .capa::after { content:""; position:absolute; inset:0; background: linear-gradient(to bottom, transparent 45%, var(--bg) 100%); }
  .capa .titulo { position:absolute; left:0; right:0; bottom: 12px; z-index:1; }
  h1 { text-align:center; font-size: 2rem; margin: 8px 0 4px; text-shadow: 0 2px 12px #000; }
  .sub { text-align:center; color: #e6dcf5; margin: 0; text-shadow: 0 1px 8px #000; }
  .card { background: var(--card); border: 1px solid #ffffff14; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  input { width:100%; padding: 12px; border-radius: 10px; border: 1px solid #ffffff22; background:#0d0a14; color: var(--text); font-size: 1rem; margin-bottom: 10px; }
  button { cursor:pointer; border:0; border-radius: 10px; padding: 12px 16px; font-size: 1rem; font-weight: 700; background: var(--orange); color:#1a0d00; }
  button:disabled { opacity:.5; cursor: default; }
  form button { width:100%; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:12px; padding: 12px 0; border-bottom: 1px solid #ffffff10; }
  li:last-child { border-bottom: 0; }
  .pos { width: 32px; text-align:center; font-size: 1.3rem; }
  .info { flex:1; min-width:0; }
  .nome { font-weight:700; overflow-wrap:anywhere; }
  .fantasia { color: var(--muted); font-size: .9rem; overflow-wrap:anywhere; }
  .votos { font-variant-numeric: tabular-nums; color: var(--orange); font-weight: 700; min-width: 2.5ch; text-align:right; }
  li button { padding: 8px 12px; font-size: .9rem; background: var(--purple); color: #fff; }
  li.meu button { background: #2ecc71; color:#06210f; }
  .foto-btn { display:block; width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px dashed #ffffff33; background:#0d0a14; color: var(--muted); font-weight:600; text-align:center; cursor:pointer; }
  .foto-btn img { display:block; width:96px; height:96px; object-fit:cover; border-radius:50%; margin:0 auto 6px; }
  .avatar { width:52px; height:52px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#0d0a14; cursor:pointer; border:2px solid #ffffff22; }
  .avatar.vazio { display:flex; align-items:center; justify-content:center; font-size:1.5rem; cursor:default; }
  #zoom { position:fixed; inset:0; background:#000d; display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #zoom.on { display:flex; }
  #zoom img { max-width:100%; max-height:100%; border-radius:12px; }
  .msg { text-align:center; color: var(--muted); font-size:.9rem; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <header class="capa">
    <img src="capa.jpg" alt="Capa do concurso">
    <div class="titulo">
      <h1>🎃 Concurso de Fantasias 👻</h1>
      <p class="sub">Cadastre sua fantasia e vote na melhor da noite</p>
    </div>
  </header>

  <section class="card">
    <h2>🧛 Me cadastrar</h2>
    <form id="form">
      <input id="nome" placeholder="Seu nome" maxlength="80" required>
      <input id="fantasia" placeholder="Sua fantasia" maxlength="120" required>
      <label class="foto-btn" id="foto-label"><img id="foto-preview" alt="" hidden><span id="foto-txt">📸 Adicionar foto (opcional)</span>
        <input id="foto" type="file" accept="image/*" hidden>
      </label>
      <button type="submit">Entrar no concurso</button>
    </form>
  </section>

  <section class="card">
    <h2>🏆 Ranking — 1 voto por celular (dá pra trocar)</h2>
    <ul id="lista"><li class="msg">Carregando...</li></ul>
  </section>
  <p class="msg" id="msg"></p>
</main>
<div id="zoom"><img alt=""></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const db = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let voterId = null;
  try { voterId = localStorage.getItem('voter_id'); } catch {}
  if (!voterId) {
    voterId = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
    try { localStorage.setItem('voter_id', voterId); } catch {}
  }
  let meuVoto = null;

  let ultimoRender = '';
  function mostrarFoto() {
    const f = $('foto').files[0], pv = $('foto-preview');
    if (pv.src) URL.revokeObjectURL(pv.src);
    pv.hidden = !f; pv.src = f ? URL.createObjectURL(f) : '';
    $('foto-txt').textContent = f ? 'Trocar foto' : '📸 Adicionar foto (opcional)';
  }

  // Reduz a foto no próprio celular (máx 800px, JPEG) antes de subir
  function comprimir(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const max = 800, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('não deu pra ler a foto')), 'image/jpeg', 0.8);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('formato de foto não suportado')); };
      img.src = url;
    });
  }

  $('foto').addEventListener('change', mostrarFoto);

  function msg(t) { $('msg').textContent = t; if (t) setTimeout(() => { if ($('msg').textContent === t) $('msg').textContent = ''; }, 3000); }

  async function carregar() {
    const [{ data, error }, voto] = await Promise.all([
      db.from('ranking').select('*'),
      db.from('votos').select('participante_id').eq('voter_id', voterId).maybeSingle(),
    ]);
    if (error) { $('lista').innerHTML = `<li class="msg">Erro: ${esc(error.message)}</li>`; return; }
    meuVoto = voto.data ? voto.data.participante_id : null;
    const chave = JSON.stringify([data, meuVoto]);
    if (chave === ultimoRender) return;
    ultimoRender = chave;
    if (!data.length) { $('lista').innerHTML = '<li class="msg">Ninguém cadastrado ainda 💀</li>'; return; }
    const medalhas = ['🥇','🥈','🥉'];
    $('lista').innerHTML = data.map((p, i) => `
      <li class="${p.id === meuVoto ? 'meu' : ''}">
        <span class="pos">${medalhas[i] || (i + 1)}</span>
        ${p.foto_url ? `<img class="avatar" src="${esc(p.foto_url)}" alt="" loading="lazy">` : '<span class="avatar vazio">🎭</span>'}
        <div class="info"><div class="nome">${esc(p.nome)}</div><div class="fantasia">${esc(p.fantasia)}</div></div>
        <span class="votos">${p.votos}</span>
        <button data-id="${p.id}">${p.id === meuVoto ? '✔ Votado' : 'Votar'}</button>
      </li>`).join('');
  }

  $('lista').addEventListener('click', async (e) => {
    const av = e.target.closest('img.avatar');
    if (av) { $('zoom').querySelector('img').src = av.src; $('zoom').classList.add('on'); return; }
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    if (id === meuVoto) return;
    btn.disabled = true;
    const { error } = await db.from('votos').upsert({ voter_id: voterId, participante_id: id }, { onConflict: 'voter_id' });
    if (error) msg('Erro ao votar: ' + error.message); else msg('Voto registrado! 🗳️');
    carregar();
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = $('nome').value.trim(), fantasia = $('fantasia').value.trim();
    if (!nome || !fantasia) return;
    const btn = e.target.querySelector('button'); btn.disabled = true;
    const textoBtn = btn.textContent;
    try {
      const novo = { nome, fantasia };
      const f = $('foto').files[0];
      if (f) {
        btn.textContent = 'Enviando foto...';
        const blob = await comprimir(f);
        const path = `${voterId}/${Date.now()}.jpg`;
        const up = await db.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw new Error('foto: ' + up.error.message);
        novo.foto_url = db.storage.from('fotos').getPublicUrl(path).data.publicUrl;
      }
      btn.textContent = 'Cadastrando...';
      const { error } = await db.from('participantes').insert(novo);
      if (error) throw error;
    } catch (err) {
      btn.disabled = false; btn.textContent = textoBtn;
      return msg('Erro: ' + err.message);
    }
    btn.disabled = false; btn.textContent = textoBtn;
    e.target.reset(); mostrarFoto(); msg('Cadastrado! Boa sorte 🎃');
    carregar();
  });

  $('zoom').addEventListener('click', () => $('zoom').classList.remove('on'));

  carregar();
  setInterval(carregar, 5000);
</script>
</body>
</html>
